<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skycell — iPhone 18 Series Pre-Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101B33;
    --navy-2:#1B2A4A;
    --green:#40B34E;
    --green-dark:#2C7C3A;
    --cream:#F7F5F0;
    --paper:#FFFFFF;
    --line:#E4E1D8;
    --ink:#1A1D1A;
    --ink-soft:#5B6058;
    --amber:#C98A2C;
    --red:#B4453D;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
  input,select,button{font-family:inherit;}

  .topbar{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{height:28px;width:auto;border-radius:5px;display:block;}
  .nav{display:flex;align-items:center;gap:8px;}
  .nav a{color:#c9d0e0;text-decoration:none;font-size:.87rem;padding:8px 14px;border-radius:7px;border:1px solid transparent;}
  .nav a:hover{background:#1e2c4e;}
  .nav a.active{background:var(--green);color:#fff;font-weight:600;}
  .branch-pill{font-size:.8rem;color:#c9d0e0;border:1px solid #3a4a6b;padding:5px 12px;border-radius:20px;}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px;}

  .select-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
     radial-gradient(circle at 15% 15%, rgba(64,179,78,.10), transparent 45%),
     radial-gradient(circle at 85% 85%, rgba(16,27,51,.08), transparent 45%), var(--cream);padding:40px 20px;}
  .select-card{width:100%;max-width:720px;text-align:center;}
  .select-card img.mark{height:56px;width:auto;margin-bottom:22px;}
  .select-card h1{font-size:1.6rem;margin:0 0 6px;}
  .select-card p.sub{color:var(--ink-soft);font-size:.95rem;margin:0 0 30px;}
  .branch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:640px){.branch-grid{grid-template-columns:repeat(2,1fr);}}
  .branch-btn{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 12px;font-size:.95rem;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color .15s ease, transform .05s ease;}
  .branch-btn:hover{border-color:var(--green);}
  .branch-btn:active{transform:translateY(1px);}
  .report-link{display:inline-block;margin-top:30px;color:var(--navy);font-size:.88rem;text-decoration:underline;cursor:pointer;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;}
  label{display:block;font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field{margin-bottom:16px;}
  input[type=text],input[type=number],input[type=tel],select{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;background:#fff;color:var(--ink);
  }
  input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(64,179,78,.15);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media(max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}
  .price-note{font-size:.8rem;color:var(--ink-soft);margin-top:-8px;margin-bottom:2px;}
  .form-actions{display:flex;align-items:center;gap:14px;margin-top:6px;}
  .status-msg{font-size:.85rem;}
  .status-msg.ok{color:var(--green-dark);}
  .status-msg.err{color:var(--red);}
  .btn{border:none;border-radius:8px;padding:12px 18px;font-weight:600;font-size:.92rem;cursor:pointer;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:hover{background:var(--green-dark);}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-amber:hover{filter:brightness(.93);}
  .row-btn{padding:6px 12px;font-size:.78rem;border-radius:6px;}

  .banner{background:#FBF0DC;border:1px solid #ECD8A6;color:#7A5B12;padding:12px 16px;border-radius:10px;font-size:.85rem;margin-bottom:20px;line-height:1.5;}
  .banner code{background:#fff;padding:1px 6px;border-radius:4px;border:1px solid #ECD8A6;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 14px;flex-wrap:wrap;gap:8px;}
  .section-head h2{font-size:1.05rem;margin:0;}
  .section-head .count{color:var(--ink-soft);font-size:.85rem;}
  .refresh{display:flex;align-items:center;gap:10px;}
  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;}
  @keyframes sp{to{transform:rotate(360deg);}}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:6px;}
  @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .stat .num{font-family:'Space Grotesk';font-size:1.5rem;font-weight:600;color:var(--navy);}
  .stat .lbl{font-size:.78rem;color:var(--ink-soft);margin-top:2px;}

  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .filters select,.filters input{width:auto;min-width:150px;}

  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);}
  table{border-collapse:collapse;width:100%;min-width:820px;font-size:.87rem;}
  thead th{background:var(--navy);color:#fff;text-align:left;padding:11px 12px;font-weight:600;white-space:nowrap;}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAF9F5;}
  .prio{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:.75rem;font-weight:600;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.76rem;font-weight:600;}
  .badge-pending{background:#FBF0DC;color:#8A6A16;}
  .badge-received{background:#DDEBFB;color:#265B8C;}
  .badge-allocated{background:#DEF0E1;color:#276936;}
  .empty{padding:34px;text-align:center;color:var(--ink-soft);font-size:.9rem;}

  footer.tag{text-align:center;color:var(--ink-soft);font-size:.78rem;margin-top:40px;}
</style>
</head>

/* ---------------------------------------------------------------------
   STATE — no login. Just: which screen, and which branch is booking.
--------------------------------------------------------------------- */
let view = "select";     // "select" | "book" | "report" | "catalog"
let selectedBranch = null;
let bookings = [];
let loading = false;
let loadError = "";
let isAdmin = false;
let catalogDraft = null; // working copy while editing in the Catalog view

const fmtINR = n => "₹" + Number(n||0).toLocaleString("en-IN");

/* Defensive display formatting: Google Sheets sometimes auto-converts a
   written date/time string into a real Date cell, which the API then
   returns as a raw UTC timestamp (e.g. "2026-10-08T18:30:00.000Z" for a
   date, or "1899-12-30T08:21:49.000Z" for a time-only value, using
   Sheets' own time epoch). These helpers detect that pattern and convert
   it back to DD/MM/YYYY and HH:MM:SS for display, assuming IST (UTC+5:30)
   since that's this business's timezone. Already-plain-text values are
   left untouched. */
const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;
function fmtDateVal(v){
  if(typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}T/.test(v)) return v;
  const d = new Date(new Date(v).getTime() + IST_OFFSET_MS);
  // Older rows were double-corrupted: Sheets read the DD/MM text as
  // MM/DD (US locale), so what we get back has day and month swapped
  // from what was actually meant. Swap them back here.
  const wrongDay = d.getUTCDate();
  const wrongMonth = d.getUTCMonth() + 1;
  const dd = String(wrongMonth).padStart(2,'0');
  const mm = String(wrongDay).padStart(2,'0');
  return `${dd}/${mm}/${d.getUTCFullYear()}`;
}
function fmtTimeVal(v){
  if(typeof v !== "string" || !/^1899-12-30T/.test(v)) return v;
  const d = new Date(new Date(v).getTime() + IST_OFFSET_MS);
  const hh = String(d.getUTCHours()).padStart(2,'0');
  const mi = String(d.getUTCMinutes()).padStart(2,'0');
  const ss = String(d.getUTCSeconds()).padStart(2,'0');
  return `${hh}:${mi}:${ss}`;
}
function configured(){ return GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.indexOf("http") === 0; }

/* ---------------------------------------------------------------------
   DATA LAYER
--------------------------------------------------------------------- */
// True once the booking form is already on screen — lets us refresh just
// the table below it instead of re-rendering the whole view (and wiping
// out whatever the user is mid-typing in the form).
function bookFormIsOnScreen(){
  return view === "book" && !!document.getElementById("branch-table-container");
}

async function fetchBookings(){
  if(!configured()){ loadError = "no-config"; render(); return; }
  loading = true; loadError="";
  if(bookFormIsOnScreen()) updateBranchQueueDOM(); else render();
  try{
    const res = await fetch(GOOGLE_SCRIPT_URL, {method:"GET"});
    const json = await res.json();
    if(json.status === "success"){ bookings = json.data || []; }
    else { loadError = json.message || "Could not load bookings."; }
  }catch(err){ loadError = "network"; }
  loading = false;
  if(bookFormIsOnScreen()) updateBranchQueueDOM(); else render();
}

async function postAction(payload){
  const res = await fetch(GOOGLE_SCRIPT_URL, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function fetchCatalog(){
  if(!configured()) return;
  try{
    const res = await fetch(GOOGLE_SCRIPT_URL + "?type=catalog");
    const json = await res.json();
    if(json.status === "success" && json.data){
      SERIES_NAME = json.data.seriesName || SERIES_NAME;
      MODELS = json.data.models || MODELS;
      COLORS = json.data.colors || COLORS;
    }
  }catch(e){ /* keep existing defaults if this fails */ }
  document.title = SERIES_NAME + " — Skycell Pre-Booking";
  render();
}

async function saveCatalog(catalog){
  return postAction({action:"updateCatalog", catalog});
}

/* ---------------------------------------------------------------------
   RENDER
--------------------------------------------------------------------- */
function render(){
  const root = document.getElementById("app");
  if(view === "select"){ root.innerHTML = renderSelect(); wireSelect(); return; }
  root.innerHTML = renderShell();
  wireShell();
}

/* ---------- BRANCH SELECT (landing) ---------- */
function renderSelect(){
  return `
  <div class="select-screen">
    <div class="select-card">
      <img class="mark" src="${LOGO_SRC}" alt="Skycell">
      <h1>${SERIES_NAME} Pre-Booking</h1>
      <p class="sub">Select your branch to start a booking</p>
      <div class="branch-grid">
        ${BRANCHES.map(b=>`<button class="branch-btn" data-branch="${b}">${b}</button>`).join("")}
      </div>
      <div class="report-link" id="goto-report">View all-branch report →</div>
    </div>
  </div>`;
}

function wireSelect(){
  document.querySelectorAll(".branch-btn").forEach(btn=>{
    btn.onclick = () => {
      selectedBranch = btn.getAttribute("data-branch");
      view = "book";
      fetchBookings();
    };
  });
  document.getElementById("goto-report").onclick = () => { view = "report"; fetchBookings(); };
}

/* ---------- SHELL (top bar + nav, used for book & report views) ---------- */
function renderShell(){
  return `
  <div class="topbar">
    <div class="brand"><img class="mark" src="${LOGO_SRC}" alt="Skycell"></div>
    <div class="nav">
      ${selectedBranch ? `<span class="branch-pill">${selectedBranch}</span>` : ""}
      <a href="#" id="nav-home">Home</a>
      ${selectedBranch ? `<a href="#" id="nav-book" class="${view==='book'?'active':''}">New booking</a>` : ""}
      <a href="#" id="nav-report" class="${view==='report'?'active':''}">Report</a>
      ${isAdmin ? `<a href="#" id="nav-catalog" class="${view==='catalog'?'active':''}">Catalog</a>` : ""}
      ${isAdmin ? `<a href="#" id="nav-admin-off">Admin: On</a>` : `<a href="#" id="nav-admin-on">Admin</a>`}
    </div>
  </div>
  <div class="wrap">
    ${!configured() ? `<div class="banner">This app isn't connected to a Google Sheet yet. Paste your Apps Script Web App URL into <code>GOOGLE_SCRIPT_URL</code> near the top of this file.</div>` : ""}
    ${loadError==="network" ? `<div class="banner">Couldn't reach the Google Sheet. Check your internet connection, or the Apps Script deployment access.</div>` : ""}
    ${view==="book" ? renderBook() : ""}
    ${view==="report" ? renderReport() : ""}
    ${view==="catalog" ? renderCatalog() : ""}
  </div>
  <footer class="tag">Skycell · Gadgets for Life</footer>
  `;
}

function wireShell(){
  document.getElementById("nav-home").onclick = (e)=>{ e.preventDefault(); selectedBranch=null; view="select"; render(); };
  const navBook = document.getElementById("nav-book");
  if(navBook) navBook.onclick = (e)=>{ e.preventDefault(); view = "book"; fetchBookings(); };
  document.getElementById("nav-report").onclick = (e)=>{ e.preventDefault(); view="report"; fetchBookings(); };
  const navCatalog = document.getElementById("nav-catalog");
  if(navCatalog) navCatalog.onclick = (e)=>{ e.preventDefault(); view="catalog"; render(); };
  const adminOn = document.getElementById("nav-admin-on");
  if(adminOn) adminOn.onclick = (e)=>{
    e.preventDefault();
    const pass = prompt("Enter admin passcode:");
    if(pass === ADMIN_PASSCODE){ isAdmin = true; render(); }
    else if(pass !== null){ alert("Incorrect passcode."); }
  };
  const adminOff = document.getElementById("nav-admin-off");
  if(adminOff) adminOff.onclick = (e)=>{ e.preventDefault(); isAdmin = false; if(view==="catalog"){ view="report"; } render(); };
  if(view==="book") wireBook();
  if(view==="report") wireReport();
  if(view==="catalog") wireCatalog();
}

/* ---------------------------------------------------------------------
   BOOKING VIEW
   The form itself is rendered once and never touched again while the
   user is on this screen — only the "recent bookings" table below it
   updates in place when data refreshes. This stops background refreshes
   from wiping out whatever the user is mid-typing in the form.
--------------------------------------------------------------------- */
function branchQueueStatusHTML(){
  return `${loading? '<span class="spin"></span> loading…':''} <a href="#" id="refresh-link">refresh</a>`;
}

function branchTableHTML(){
  const todaysBranchRows = bookings
    .filter(b=>b.Branch===selectedBranch)
    .sort((a,b)=> (b.Date+b.Time).localeCompare(a.Date+a.Time))
    .slice(0,5);
  if(!todaysBranchRows.length) return `<div class="table-wrap"><div class="empty">No bookings from this branch yet.</div></div>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Time</th><th>Customer</th><th>Mobile</th><th>Model</th><th>Variant</th><th>Color</th><th>Advance</th><th>Payment</th><th>Status</th></tr></thead>
    <tbody>${todaysBranchRows.map(b=>`<tr>
      <td>${fmtDateVal(b.Date)}</td><td>${fmtTimeVal(b.Time)}</td><td>${b.CustomerName}</td><td>${b.Mobile}</td><td>${b.Model}</td><td>${b.Variant}</td><td>${b.Color}</td>
      <td>${fmtINR(b.AdvanceAmount)}</td><td>${b.PaymentMode||""}</td><td>${statusBadge(b.Status)}</td>
    </tr>`).join("")}</tbody>
  </table></div>`;
}

function wireBranchQueueStatus(){
  const rl = document.getElementById("refresh-link");
  if(rl) rl.onclick = (e)=>{ e.preventDefault(); fetchBookings(); };
}

// Updates only the status line + table, leaving the form and whatever
// the user is typing completely untouched.
function updateBranchQueueDOM(){
  const statusEl = document.getElementById("branch-queue-status");
  const tableEl = document.getElementById("branch-table-container");
  if(statusEl) statusEl.innerHTML = branchQueueStatusHTML();
  if(tableEl) tableEl.innerHTML = branchTableHTML();
  wireBranchQueueStatus();
}

function renderBook(){
  return `
  <div class="card">
    <div style="margin-bottom:14px;"><a href="#" id="back-to-select" style="color:var(--ink-soft);font-size:.85rem;text-decoration:none;">← Change branch</a></div>
    <h2 style="margin-top:0;">New booking — ${selectedBranch}</h2>
    <div class="grid-2">
      <div class="field"><label>Customer Name</label><input type="text" id="f-name" placeholder="Full name"></div>
      <div class="field"><label>Mobile Number</label><input type="tel" id="f-mobile" placeholder="10-digit mobile number" maxlength="10"></div>
    </div>
    <div class="grid-3">
      <div class="field"><label>Model</label>
        <select id="f-model">
          <option value="">Select model</option>
          ${Object.keys(MODELS).map(m=>`<option value="${m}">${m}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Variant</label>
        <select id="f-variant"><option value="">Select model first</option></select>
      </div>
      <div class="field"><label>Color</label>
        <select id="f-color">
          <option value="">Select color</option>
          ${COLORS.map(c=>`<option value="${c}">${c}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="price-note" id="price-note"></div>
    <div class="grid-2">
      <div class="field"><label>Advance Amount (₹)</label><input type="number" id="f-advance" placeholder="e.g. 5000" min="0"></div>
      <div class="field"><label>Payment Mode</label>
        <select id="f-payment">
          <option value="">Select payment mode</option>
          <option value="Ready">Ready</option>
          <option value="Finance">Finance</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="btn-book">Confirm booking</button>
      <span class="status-msg" id="book-status"></span>
    </div>
  </div>

  <div class="section-head">
    <h2>Recent bookings — ${selectedBranch}</h2>
    <span class="count refresh" id="branch-queue-status">${branchQueueStatusHTML()}</span>
  </div>
  <div id="branch-table-container">${branchTableHTML()}</div>
  `;
}

function wireBook(){
  document.getElementById("back-to-select").onclick = (e)=>{ e.preventDefault(); selectedBranch=null; view="select"; render(); };
  const modelSel = document.getElementById("f-model");
  const variantSel = document.getElementById("f-variant");
  const priceNote = document.getElementById("price-note");
  modelSel.onchange = () => {
    const m = modelSel.value;
    if(!m){ variantSel.innerHTML = `<option value="">Select model first</option>`; priceNote.textContent=""; return; }
    variantSel.innerHTML = `<option value="">Select variant</option>` + Object.keys(MODELS[m]).map(v=>`<option value="${v}">${v} — ${fmtINR(MODELS[m][v])}</option>`).join("");
    priceNote.textContent = "";
  };
  variantSel.onchange = () => {
    const m = modelSel.value, v = variantSel.value;
    priceNote.textContent = (m && v) ? `List price: ${fmtINR(MODELS[m][v])}` : "";
  };

  document.getElementById("btn-book").onclick = async () => {
    const name = document.getElementById("f-name").value.trim();
    const mobile = document.getElementById("f-mobile").value.trim();
    const model = modelSel.value;
    const variant = variantSel.value;
    const color = document.getElementById("f-color").value;
    const advance = document.getElementById("f-advance").value;
    const paymentMode = document.getElementById("f-payment").value;
    const status = document.getElementById("book-status");

    if(!name || !/^\d{10}$/.test(mobile) || !model || !variant || !color || !advance || Number(advance)<=0 || !paymentMode){
      status.textContent = "Please fill every field correctly (mobile must be 10 digits).";
      status.className = "status-msg err";
      return;
    }
    if(!configured()){
      status.textContent = "App not connected to a Google Sheet yet.";
      status.className = "status-msg err";
      return;
    }
    status.textContent = "Saving…"; status.className="status-msg";
    try{
      const resp = await postAction({
        action:"book", branch:selectedBranch,
        customerName:name, mobile, model, variant, color, advanceAmount:Number(advance), paymentMode
      });
      if(resp.status==="success"){
        status.textContent = "Booked — ID " + resp.bookingId;
        status.className = "status-msg ok";
        document.getElementById("f-name").value="";
        document.getElementById("f-mobile").value="";
        document.getElementById("f-advance").value="";
        document.getElementById("f-color").value="";
        document.getElementById("f-payment").value="";
        await fetchBookings();
      } else {
        status.textContent = resp.message || "Something went wrong.";
        status.className = "status-msg err";
      }
    }catch(e){
      status.textContent = "Network error — booking not saved. Please retry.";
      status.className = "status-msg err";
    }
  };

  wireBranchQueueStatus();
}

/* ---------------------------------------------------------------------
   REPORT VIEW — public, no login. Priority queue per Model+Variant.
   Columns: Date (DDMMYYYY), Time (HHMMSS), Branch, Model, Variant,
   Color, Advance Amount, Status, priority rank, plus stock actions.
--------------------------------------------------------------------- */
let reportFilters = {branch:"", model:"", status:"", paymentMode:""};

function renderReport(){
  let rows = bookings.slice().sort((a,b)=> (a.Date+a.Time).localeCompare(b.Date+b.Time));

  const seen = {};
  rows.forEach(b=>{
    const k = b.Model+"|"+b.Variant;
    seen[k] = (seen[k]||0)+1;
    b.__prio = seen[k];
  });

  const filtered = rows.filter(b =>
    (!reportFilters.branch || b.Branch===reportFilters.branch) &&
    (!reportFilters.model || b.Model===reportFilters.model) &&
    (!reportFilters.status || b.Status===reportFilters.status) &&
    (!reportFilters.paymentMode || b.PaymentMode===reportFilters.paymentMode)
  );

  const totalAdvance = rows.reduce((s,b)=>s+Number(b.AdvanceAmount||0),0);
  const pending = rows.filter(b=>b.Status==="Pending").length;
  const allocated = rows.filter(b=>b.Status==="Allocated").length;

  return `
  <div class="stats">
    <div class="stat"><div class="num">${rows.length}</div><div class="lbl">Total bookings</div></div>
    <div class="stat"><div class="num">${fmtINR(totalAdvance)}</div><div class="lbl">Advance collected</div></div>
    <div class="stat"><div class="num">${pending}</div><div class="lbl">Pending stock</div></div>
    <div class="stat"><div class="num">${allocated}</div><div class="lbl">Allocated</div></div>
  </div>

  <div class="section-head">
    <h2>Booking report — priority order</h2>
    <span class="count refresh">${loading? '<span class="spin"></span> loading…':''} ${filtered.length} shown · <a href="#" id="refresh-link">refresh</a></span>
  </div>
  <div class="filters">
    <select id="rf-branch"><option value="">All branches</option>${BRANCHES.map(b=>`<option ${reportFilters.branch===b?'selected':''} value="${b}">${b}</option>`).join("")}</select>
    <select id="rf-model"><option value="">All models</option>${Object.keys(MODELS).map(m=>`<option ${reportFilters.model===m?'selected':''} value="${m}">${m}</option>`).join("")}</select>
    <select id="rf-status"><option value="">All statuses</option>${["Pending","Stock Received","Allocated"].map(s=>`<option ${reportFilters.status===s?'selected':''} value="${s}">${s}</option>`).join("")}</select>
    <select id="rf-payment"><option value="">All payment modes</option>${["Ready","Finance"].map(p=>`<option ${reportFilters.paymentMode===p?'selected':''} value="${p}">${p}</option>`).join("")}</select>
  </div>
  ${renderReportTable(filtered)}
  `;
}

function statusBadge(s){
  if(s==="Allocated") return `<span class="badge badge-allocated">Allocated</span>`;
  if(s==="Stock Received") return `<span class="badge badge-received">Stock Received</span>`;
  return `<span class="badge badge-pending">Pending</span>`;
}

function renderReportTable(rows){
  if(!rows.length) return `<div class="table-wrap"><div class="empty">No bookings yet.</div></div>`;
  const body = rows.map(b=>{
    let action = "";
    if(!isAdmin){
      action = `<span style="color:var(--ink-soft);font-size:.8rem;">Admin only</span>`;
    } else if(b.Status==="Pending") action = `<button class="btn btn-outline row-btn" data-action="Stock Received" data-id="${b.BookingID}">Mark stock received</button>`;
    else if(b.Status==="Stock Received") action = `<button class="btn btn-amber row-btn" data-action="Allocated" data-id="${b.BookingID}">Allocate</button>`;
    else action = `<span style="color:var(--ink-soft);font-size:.8rem;">Done</span>`;
    return `<tr>
      <td><span class="prio">${b.__prio}</span></td>
      <td>${fmtDateVal(b.Date)}</td><td>${fmtTimeVal(b.Time)}</td><td>${b.Branch}</td><td>${b.CustomerName}</td><td>${b.Mobile}</td><td>${b.Model}</td><td>${b.Variant}</td><td>${b.Color}</td>
      <td>${fmtINR(b.AdvanceAmount)}</td><td>${b.PaymentMode||""}</td><td>${statusBadge(b.Status)}</td><td>${action}</td>
    </tr>`;
  }).join("");
  return `<div class="table-wrap"><table>
    <thead><tr><th>#</th><th>Date</th><th>Time</th><th>Branch</th><th>Customer</th><th>Mobile</th><th>Model</th><th>Variant</th><th>Color</th><th>Advance</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead>
    <tbody>${body}</tbody>
  </table></div>`;
}

function wireReport(){
  document.getElementById("rf-branch").onchange = e=>{reportFilters.branch=e.target.value; render();};
  document.getElementById("rf-model").onchange = e=>{reportFilters.model=e.target.value; render();};
  document.getElementById("rf-status").onchange = e=>{reportFilters.status=e.target.value; render();};
  document.getElementById("rf-payment").onchange = e=>{reportFilters.paymentMode=e.target.value; render();};
  const rl = document.getElementById("refresh-link");
  if(rl) rl.onclick = (e)=>{e.preventDefault(); fetchBookings();};

  document.querySelectorAll("[data-action]").forEach(btn=>{
    btn.onclick = async () => {
      const id = btn.getAttribute("data-id");
      const newStatus = btn.getAttribute("data-action");
      btn.disabled = true; btn.textContent = "Updating…";
      try{
        const resp = await postAction({action:"updateStatus", bookingId:id, newStatus});
        if(resp.status==="success"){ await fetchBookings(); }
        else { alert(resp.message || "Could not update status."); render(); }
      }catch(e){ alert("Network error — status not updated."); render(); }
    };
  });
}

/* ---------------------------------------------------------------------
   ADMIN — CATALOG EDITOR
   Lets an admin rename the series, and add/edit/remove Models (with
   their variants + prices) and Colors. Saved to the Sheet so every
   visitor sees the same catalog.
--------------------------------------------------------------------- */
function renderCatalog(){
  if(!isAdmin){ return `<div class="banner">Admin access required.</div>`; }
  if(!catalogDraft){
    catalogDraft = { seriesName: SERIES_NAME, models: JSON.parse(JSON.stringify(MODELS)), colors: COLORS.slice() };
  }
  const modelCards = Object.keys(catalogDraft.models).map(modelName=>{
    const variants = catalogDraft.models[modelName];
    const variantRows = Object.keys(variants).map(vName=>`
      <div class="grid-3" style="margin-bottom:8px;align-items:end;">
        <div class="field" style="margin-bottom:0;"><label>Variant</label><input type="text" data-vfield="name" data-model="${modelName}" data-variant="${vName}" value="${vName}"></div>
        <div class="field" style="margin-bottom:0;"><label>Price (₹)</label><input type="number" data-vfield="price" data-model="${modelName}" data-variant="${vName}" value="${variants[vName]}"></div>
        <button class="btn btn-outline row-btn" data-remove-variant data-model="${modelName}" data-variant="${vName}">Remove variant</button>
      </div>`).join("");
    return `
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="margin:0;">${modelName}</h3>
        <button class="btn btn-outline row-btn" data-remove-model="${modelName}">Remove model</button>
      </div>
      ${variantRows || `<p style="color:var(--ink-soft);font-size:.85rem;">No variants yet.</p>`}
      <button class="btn btn-outline row-btn" data-add-variant="${modelName}">+ Add variant</button>
    </div>`;
  }).join("");

  return `
  <div class="section-head"><h2>Catalog — admin editor</h2></div>

  <div class="card" style="margin-bottom:16px;">
    <label>Series name (shown on the landing page)</label>
    <input type="text" id="cat-series" value="${catalogDraft.seriesName}">
  </div>

  ${modelCards}
  <button class="btn btn-outline" id="add-model-btn" style="margin-bottom:20px;">+ Add new model</button>

  <div class="card" style="margin-bottom:20px;">
    <label>Colors</label>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
      ${catalogDraft.colors.map(c=>`<span class="badge badge-received" style="display:inline-flex;align-items:center;gap:6px;">${c} <a href="#" data-remove-color="${c}" style="color:inherit;text-decoration:none;font-weight:700;">×</a></span>`).join("")}
    </div>
    <div style="display:flex;gap:10px;">
      <input type="text" id="new-color-input" placeholder="New color name" style="max-width:220px;">
      <button class="btn btn-outline row-btn" id="add-color-btn">+ Add color</button>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn btn-primary" id="save-catalog-btn">Save changes</button>
    <span class="status-msg" id="catalog-status"></span>
  </div>
  `;
}

function wireCatalog(){
  if(!isAdmin) return;

  document.getElementById("cat-series").oninput = e=>{ catalogDraft.seriesName = e.target.value; };

  document.querySelectorAll('[data-vfield="name"]').forEach(inp=>{
    inp.onchange = ()=>{
      const model = inp.getAttribute("data-model"), oldName = inp.getAttribute("data-variant"), newName = inp.value.trim();
      if(!newName || newName===oldName) { render(); return; }
      const price = catalogDraft.models[model][oldName];
      delete catalogDraft.models[model][oldName];
      catalogDraft.models[model][newName] = price;
      render();
    };
  });
  document.querySelectorAll('[data-vfield="price"]').forEach(inp=>{
    inp.onchange = ()=>{
      const model = inp.getAttribute("data-model"), vName = inp.getAttribute("data-variant");
      catalogDraft.models[model][vName] = Number(inp.value) || 0;
    };
  });
  document.querySelectorAll('[data-remove-variant]').forEach(btn=>{
    btn.onclick = ()=>{
      const model = btn.getAttribute("data-model"), vName = btn.getAttribute("data-variant");
      delete catalogDraft.models[model][vName];
      render();
    };
  });
  document.querySelectorAll('[data-add-variant]').forEach(btn=>{
    btn.onclick = ()=>{
      const model = btn.getAttribute("data-add-variant");
      const name = prompt("New variant name (e.g. 256 GB):");
      if(!name) return;
      const price = Number(prompt("Price in ₹:", "0")) || 0;
      catalogDraft.models[model][name.trim()] = price;
      render();
    };
  });
  document.querySelectorAll('[data-remove-model]').forEach(btn=>{
    btn.onclick = ()=>{
      const model = btn.getAttribute("data-remove-model");
      if(!confirm(`Remove "${model}" and all its variants?`)) return;
      delete catalogDraft.models[model];
      render();
    };
  });
  document.getElementById("add-model-btn").onclick = ()=>{
    const name = prompt("New model name (e.g. iPhone 19 Pro):");
    if(!name) return;
    if(catalogDraft.models[name.trim()]){ alert("That model already exists."); return; }
    catalogDraft.models[name.trim()] = {};
    render();
  };
  document.querySelectorAll('[data-remove-color]').forEach(a=>{
    a.onclick = (e)=>{
      e.preventDefault();
      const c = a.getAttribute("data-remove-color");
      catalogDraft.colors = catalogDraft.colors.filter(x=>x!==c);
      render();
    };
  });
  document.getElementById("add-color-btn").onclick = ()=>{
    const inp = document.getElementById("new-color-input");
    const c = inp.value.trim();
    if(!c) return;
    if(!catalogDraft.colors.includes(c)) catalogDraft.colors.push(c);
    render();
  };

  document.getElementById("save-catalog-btn").onclick = async () => {
    const statusEl = document.getElementById("catalog-status");
    statusEl.textContent = "Saving…"; statusEl.className = "status-msg";
    try{
      const resp = await saveCatalog(catalogDraft);
      if(resp.status === "success"){
        SERIES_NAME = catalogDraft.seriesName;
        MODELS = catalogDraft.models;
        COLORS = catalogDraft.colors;
        document.title = SERIES_NAME + " — Skycell Pre-Booking";
        statusEl.textContent = "Saved.";
        statusEl.className = "status-msg ok";
      } else {
        statusEl.textContent = resp.message || "Could not save.";
        statusEl.className = "status-msg err";
      }
    }catch(e){
      statusEl.textContent = "Network error — changes not saved.";
      statusEl.className = "status-msg err";
    }
  };
}

/* ---------------------------------------------------------------------
   BOOT — paint the screen immediately with default catalog data, then
   quietly refresh once the real catalog arrives from the Sheet. This
   keeps the landing screen from feeling slow to appear.
--------------------------------------------------------------------- */
render();
fetchCatalog();
</script>
